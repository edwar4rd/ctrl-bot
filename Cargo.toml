[package]
name = "ctrl-bot"
version = "0.0.9"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.10.2"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "process",
    "io-std",
] }
tokio-util = { version = "0.7.19", features = ["codec"] }
base64 = "0.23.1"
rsa = "0.9.10"
sha3 = { version = "0.12.0", features = ["oid"] }
build-time = "0.1.3"
poise = "0.7.0"

[features]
default = ["dcbothub", "tools", "shell"]
random = []
stdio_tests = []
modal_tests = ["handler"]
tools = ["handler"]
dcbothub = []
handler = []
shell = []
